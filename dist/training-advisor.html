    if(chips.length) why = '<div class="why"><span class="k">Matched</span>'+chips.map(function(c){return '<span class="m">'+esc(c)+'</span>';}).join("")+'</div>';
  }
  var action = d.type==="Live session" ? "Register" : (d.type==="Webinar" ? "Open webinar" : "Open course");
  return '<article class="card '+cls+(best?' best':'')+((long&&!open)?' clamp':'')+'" data-id="'+d.id+'">'
    + (best ? '<span class="ribbon">Best match</span>' : '')
    + '<div class="meta" style="margin-top:'+(best?'10':'0')+'px"><span class="badge"><i></i>'+esc(d.type)+'</span>'
    + (d.dur ? '<span class="dur">'+ICON.clock+esc(d.dur)+'</span>' : '')
    + '<span class="dot">•</span><span>'+esc(d.cats.join(" · "))+'</span></div>'
    + '<h3>'+hl(d.title,P)+'</h3>'
    + '<div class="desc">'+descHTML+'</div>'
    + (long ? '<button class="more" type="button" data-act="expand" data-id="'+d.id+'" aria-expanded="'+open+'">'+(open?'Show less':'Show more')+'</button>' : '')
    + notes + why
    + '<div class="actions">'
    + '<a class="btn '+(best?'gold':'primary')+'" href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">'+ICON.open+action+'</a>'
    + '<button class="btn ghost" type="button" data-act="copylink" data-id="'+d.id+'">'+ICON.link+'Copy link</button>'
    + '<button class="btn ghost" type="button" data-act="copyreply" data-id="'+d.id+'">'+ICON.msg+'Copy for client</button>'
    + '</div></article>';
}

function browseList(){
  var types = {"Course":0,"Webinar":1,"Live session":2};
  return DATA.map(function(d){return {id:d.id,score:0,labels:[]};}).sort(function(a,b){
    var A=DATA[a.id],B=DATA[b.id];
    return types[A.type]-types[B.type] || A.title.localeCompare(B.title);
  });
}

function render(){
  var q = state.q.trim(), res = $("#results"), summary = $("#summary");
  var base, missing = [], P = null, searching = q.length>0, typeOnly = false;
  if(searching){ var r = runSearch(q); base = r.hits; missing = r.missing; P = r.P; typeOnly = !!r.typeOnly; LAST = {hits:base, missing:missing, P:P}; }
  else { base = state.cat==="all" ? [] : browseList(); LAST = {hits:[], missing:[], P:null}; }
  var catFiltered = base.filter(function(h){ return state.cat==="all" || DATA[h.id].cats.indexOf(state.cat)>=0; });
  var counts = {all:catFiltered.length}; TYPES.forEach(function(t){ counts[t]=catFiltered.filter(function(h){return DATA[h.id].type===t;}).length; });
  var list = catFiltered.filter(function(h){ return state.type==="all" || DATA[h.id].type===state.type; });

  /* type segmented control */
  var segHTML = '<button type="button" data-type="all" aria-pressed="'+(state.type==="all")+'">All'+((searching||state.cat!=="all")?'<span class="n">'+counts.all+'</span>':'')+'</button>';
  TYPES.forEach(function(t){ segHTML += '<button type="button" data-type="'+t+'" aria-pressed="'+(state.type===t)+'">'+TYPE_LABEL_PLURAL[t]+((searching||state.cat!=="all")?'<span class="n">'+counts[t]+'</span>':'')+'</button>'; });
  $("#typeSeg").innerHTML = segHTML;

  if(!searching && state.cat==="all"){
    /* Home: browse tiles */
    summary.innerHTML = "";
    var shapes = [
      '<svg class="g" viewBox="0 0 58 58" aria-hidden="true"><rect width="58" height="58" fill="#152E7C"/><path d="M29 8L50 30H8z" fill="#357DE4"/><path d="M29 30L50 52H8z" fill="#1F64C5"/></svg>',
      '<svg class="g" viewBox="0 0 58 58" aria-hidden="true"><rect width="58" height="58" fill="#1B9587"/><path d="M58 0A58 58 0 0 1 0 58V0z" fill="#29DBBE"/></svg>',
      '<svg class="g" viewBox="0 0 58 58" aria-hidden="true"><rect width="58" height="58" fill="#692E53"/><path d="M0 0l29 29L58 0v29L29 58 0 29z" fill="#AE5294"/></svg>',
      '<svg class="g" viewBox="0 0 58 58" aria-hidden="true"><rect width="58" height="58" fill="#0251B3"/><rect x="0" y="29" width="29" height="29" fill="#357DE4"/><rect x="29" y="0" width="29" height="29" fill="#1F64C5"/></svg>'
    ];
    var tiles = CATS.map(function(c,i){
      var n = DATA.filter(function(d){return d.cats.indexOf(c)>=0;}).length;
      return '<button class="tile" type="button" data-cat="'+esc(c)+'">'+shapes[i%shapes.length]+'<b>'+esc(c)+'</b><span>'+n+' resource'+(n===1?'':'s')+'</span></button>';
    }).join("");
    var homeList = "";
    if(state.type!=="all"){
      var bl = browseList().filter(function(h){return DATA[h.id].type===state.type;});
      homeList = '<h2 class="h2s">All '+TYPE_LABEL_PLURAL[state.type].toLowerCase()+' <span style="color:var(--muted);font-size:16px;font-family:var(--sans);font-weight:700">'+bl.length+'</span></h2><div class="list">'+bl.map(function(h,i){return cardHTML(h,i,{best:false});}).join("")+'</div>';
    }
    res.innerHTML = '<h2 class="h2s" style="margin-top:20px">Or browse by category</h2><div class="tiles">'+tiles+'</div>'+homeList;
    return;
  }

  /* Summary line */
  var title, sub = "";
  if(searching){
    title = list.length ? (list.length+" suggestion"+(list.length===1?"":"s")+" for “"+q+"”") : "No match for “"+q+"”";
    if(typeOnly && list.length) title = list.length+" "+TYPE_LABEL_PLURAL[P.typeIntent].toLowerCase()+" in the catalog";
    else if(P && P.typeIntent && list.length) sub = "Leaning toward "+P.typeIntent.toLowerCase()+"s based on your wording.";
  } else {
    title = state.cat + " — " + list.length + " resource"+(list.length===1?"":"s");
  }
  var copyAll = (searching && list.length) ? '<button class="btn ghost sm" type="button" data-act="copytop">'+ICON.msg+'Copy top picks for client</button>' : '';
  summary.innerHTML = '<div><h2>'+esc(title)+'</h2>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')+'</div>'+copyAll;

  if(!list.length){
    var extra = "";
    if(searching && counts.all>0 && state.type!=="all") extra = "Try “All” formats — there are "+counts.all+" match"+(counts.all===1?"":"es")+" in other formats.";
    else if(searching) extra = "Try different words, a product name (like “Zelle” or “Bill Pay”), or browse by category.";
    else extra = "Nothing in this category for that format.";
    var filtered = state.cat!=="all" || state.type!=="all";
    if(searching && filtered && base.length===0 && !typeOnly) extra = "Nothing matches that wording yet. Try different words or a product name.";
    if(searching && state.cat!=="all" && catFiltered.length===0 && base.length>0) extra = "Nothing in “"+state.cat+"” matches. "+base.length+" match"+(base.length===1?"":"es")+" in other categories.";
    if(searching && typeOnly && state.cat!=="all") extra = "No "+TYPE_LABEL_PLURAL[P.typeIntent].toLowerCase()+" in “"+state.cat+"”.";
    res.innerHTML = '<div class="empty"><h2>Nothing here yet</h2><p>'+esc(extra)+'</p><p>'
      + (filtered ? '<button class="btn primary" type="button" data-act="clearfilters">Clear filters</button> ' : '')
      + (searching ? '<button class="btn ghost" type="button" data-act="home">Browse by category</button>' : '')
      + '</p></div>';
    return;
  }

  var html = '';
  if(searching){
    var top = list[0];
    var weak = !typeOnly && (top.cov < 0.5 || top.score < 2.2);
    if(weak) html += '<div class="weak"><b>Closest matches.</b> Nothing lines up exactly with that wording. Worth a quick second look before sending.</div>';
    if(missing.length) html += '<p class="miss">No catalog hits for: '+missing.map(function(m){return "“"+esc(m)+"”";}).join(", ")+'</p>';
    html += '<div class="list">';
    if(typeOnly){ html += list.map(function(h,i){return cardHTML(h,i,{best:false});}).join("") + '</div>'; res.innerHTML = html; return; }
    html += cardHTML(list[0],0,{best:!weak});
    var rest = list.slice(1);
    var first = rest.slice(0,5), more = rest.slice(5);
    if(first.length) html += '<div class="section-label">Also worth a look</div>' + first.map(function(h,i){return cardHTML(h,i+1,{best:false});}).join("");
    if(more.length){
      if(state.showAll) html += '<div class="section-label">More results</div>' + more.map(function(h,i){return cardHTML(h,i+6,{best:false});}).join("");
      else html += '<button class="btn ghost moreBtn" type="button" data-act="showall">Show '+more.length+' more result'+(more.length===1?'':'s')+'</button>';
    }
    html += '</div>';
  } else {
    html += '<div class="list">'+list.map(function(h,i){return cardHTML(h,i,{best:false});}).join("")+'</div>';
  }
  res.innerHTML = html;
}

function buildCatSelect(){
  var s = $("#cat"), h = '<option value="all">All categories</option>';
  CATS.forEach(function(c){ h += '<option value="'+esc(c)+'">'+esc(c)+'</option>'; });
  s.innerHTML = h; s.value = state.cat;
}
function setQuery(v, opts){
  state.q = v; state.showAll = false;
  var inp = $("#q"); if(inp.value!==v) inp.value = v;
  $("#clear").classList.toggle("on", v.length>0);
  render();
  if(opts && opts.save) saveRecent(v);
}

/* recent searches (per-viewer convenience; safe if storage is unavailable) */
function getRecent(){ try{ var r = JSON.parse(localStorage.getItem("ta_recent")||"[]"); return Array.isArray(r)?r.slice(0,5):[]; }catch(e){ return []; } }
function saveRecent(q){
  q = q.trim(); if(q.length<3) return;
  try{ var r = getRecent().filter(function(x){return x.toLowerCase()!==q.toLowerCase();}); r.unshift(q); localStorage.setItem("ta_recent", JSON.stringify(r.slice(0,5))); }catch(e){}
  drawRecent();
}
function drawRecent(){
  var r = getRecent(), w = $("#recentWrap");
  w.hidden = !r.length;
  $("#recent").innerHTML = r.map(function(x){return '<button class="chip" type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>';}).join("");
}

/* clipboard */
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},1800); }
function copy(text, msg){
  function fallback(){
    try{ var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); var ok=document.execCommand("copy"); document.body.removeChild(ta); toast(ok?msg:"Couldn’t copy — select and copy manually"); }catch(e){ toast("Couldn’t copy — select and copy manually"); }
  }
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast(msg);}, fallback); } else fallback(); }catch(e){ fallback(); }
}
function line(d){ return d.title+" ("+d.type+(d.dur?", "+d.dur:"")+")"; }

/* events */
$("#q").addEventListener("input", function(e){
  var v = e.target.value; setQuery(v);
  clearTimeout(this._t); this._t = setTimeout(function(){ saveRecent(v); }, 1200);
});
$("#q").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); saveRecent(this.value); this.blur(); } if(e.key==="Escape"){ setQuery(""); } });
$("#clear").addEventListener("click", function(){ setQuery(""); $("#q").focus(); });
document.addEventListener("keydown", function(e){
  if(e.key==="/" && document.activeElement && document.activeElement.tagName!=="INPUT" && document.activeElement.tagName!=="SELECT"){ e.preventDefault(); $("#q").focus(); }
});
$("#cat").addEventListener("change", function(e){ state.cat = e.target.value; state.showAll=false; render(); });
$("#typeSeg").addEventListener("click", function(e){ var b=e.target.closest("button[data-type]"); if(!b) return; state.type=b.getAttribute("data-type"); state.showAll=false; render(); });
document.addEventListener("click", function(e){
  var chip = e.target.closest("button[data-q]");
  if(chip){ setQuery(chip.getAttribute("data-q"), {save:true}); window.scrollTo({top:document.querySelector("main").offsetTop-10,behavior:"smooth"}); return; }
  var tile = e.target.closest("button[data-cat]");
  if(tile){ state.cat = tile.getAttribute("data-cat"); $("#cat").value = state.cat; state.type="all"; render(); window.scrollTo({top:document.querySelector("main").offsetTop-10,behavior:"smooth"}); return; }
  var a = e.target.closest("[data-act]"); if(!a) return;
  var act = a.getAttribute("data-act"), id = +a.getAttribute("data-id"), d = DATA[id];
  if(act==="expand"){ state.expanded[id] = !state.expanded[id]; render(); var el=document.querySelector('.more[data-id="'+id+'"]'); if(el) el.focus(); }
  else if(act==="copylink"){ copy(d.url,"Link copied"); }
  else if(act==="copyreply"){ copy("This should help: "+line(d)+"\n"+d.url,"Reply copied"); }
  else if(act==="copytop"){
    var picks = LAST.hits.filter(function(h){ return (state.cat==="all"||DATA[h.id].cats.indexOf(state.cat)>=0) && (state.type==="all"||DATA[h.id].type===state.type); }).slice(0,3);
    copy("Here are some resources that should help:\n\n"+picks.map(function(h,i){var x=DATA[h.id]; return (i+1)+". "+line(x)+"\n   "+x.url;}).join("\n\n"),"Top picks copied");
  }
  else if(act==="showall"){ state.showAll = true; render(); }
  else if(act==="clearfilters"){ state.cat="all"; state.type="all"; $("#cat").value="all"; state.showAll=false; render(); }
  else if(act==="home"){ setQuery(""); state.cat="all"; $("#cat").value="all"; state.type="all"; render(); }
});

/* init */
$("#picks").innerHTML = QUICK.map(function(x){return '<button class="chip" type="button" data-q="'+esc(x)+'">'+esc(x)+'</button>';}).join("");
$("#footNote").textContent = "Built from the training catalog · "+N+" resources";
buildCatSelect(); drawRecent(); render();
window.__advisor = {search:function(q){ var r=runSearch(q); return r.hits.map(function(h){return [DATA[h.id].title, DATA[h.id].type, +h.score.toFixed(2), +h.cov.toFixed(2)];}); }};
})();
</script>
</body>
</html>
